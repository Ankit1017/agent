[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "local-terminal-harness"
version = "0.1.0"
description = "A minimal approval-based local terminal agent harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135,<0.136",
  "faster-whisper>=1.2,<2",
  "httpx>=0.28,<1",
  "openai>=1.40,<3",
  "piper-tts>=1.6,<2",
  "sherpa-onnx>=1.12,<2",
  "textual>=8.2,<9",
  "trafilatura>=2.1,<3",
  "tree-sitter-language-pack>=1.14,<2",
  "uvicorn[standard]>=0.51,<0.52",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "pytest-textual-snapshot>=1.1",
  "ruff>=0.6",
]

[project.scripts]
harness = "local_harness.interfaces.cli:main"
harness-web = "local_harness.interfaces.web.server:main"
harness-eval = "local_harness.interfaces.eval_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_harness"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config"
markers = ["live: requires a running local LiteLLM gateway"]

[tool.coverage.run]
branch = true
source = ["local_harness"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
