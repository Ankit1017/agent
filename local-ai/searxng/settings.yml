use_default_settings:
  engines:
    keep_only:
      - bing
      - brave
      - duckduckgo

general:
  debug: false
  instance_name: Local Harness Search
  enable_metrics: false

search:
  safe_search: 1
  autocomplete: ""
  default_lang: auto
  max_page: 10
  formats:
    - html
    - json

server:
  limiter: false
  public_instance: false
  image_proxy: false

outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0
